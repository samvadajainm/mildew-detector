<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaf Scorer</title>
<script async src="https://docs.opencv.org/4.9.0/opencv.js" onload="window.__cvScriptLoaded = true;"></script>
<style>
  :root {
    --forest: #1B3A2E;
    --forest-hover: #142B22;
    --mint-bg: #EAF3EC;
    --mint-border: #A9C9B3;
    --page-bg: #F5F1E6;
    --healthy: #2E7D32;
    --infected: #B71C1C;
    --gray-disabled: #D9D6CC;
    --error: #B71C1C;
    --warn-bg: #FDF6E7;
    --warn-border: #E0A82E;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--page-bg);
    margin: 0;
    padding: 40px 16px;
  }
  .card { max-width: 480px; margin: 0 auto; }
  h2 { color: #1a1a1a; text-align: center; font-size: 26px; margin: 0 0 6px; }
  #subtitle { text-align: center; color: #555; margin: 0 0 20px; font-size: 15px; }
  #status { text-align: center; color: #888; margin-bottom: 14px; min-height: 16px; font-size: 13px; }
  #status.error { color: var(--error); font-weight: 600; }

  #dropZone {
    border: 2px dashed var(--mint-border);
    border-radius: 14px;
    background: var(--mint-bg);
    padding: 40px 24px;
    text-align: center;
  }
  #dropZone.dragover { border-color: var(--forest); }
  #dropZone svg { display: block; margin: 0 auto 18px; }

  #selectBtn {
    background: var(--forest);
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #selectBtn:hover { background: var(--forest-hover); }

  #dropZoneSub { color: #6b6b6b; font-size: 13px; margin-top: 14px; }
  #fileInput { display: none; }

  #previewWrap { display: none; }
  #previewImg { max-width: 100%; max-height: 260px; border-radius: 8px; display: block; margin: 0 auto 14px; }
  #changeImageBtn {
    background: none;
    border: 1px solid var(--mint-border);
    color: var(--forest);
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  #changeImageBtn:hover { background: #DDEBE1; }

  #procCanvas { display: none; }

  #analyzeBtn {
    width: 100%;
    margin-top: 18px;
    background: var(--gray-disabled);
    color: #9c988c;
    border: none;
    padding: 15px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: default;
    transition: background 0.15s, color 0.15s;
    box-sizing: border-box;
  }
  #analyzeBtn.active { background: var(--forest); color: white; cursor: pointer; }
  #analyzeBtn.active:hover { background: var(--forest-hover); }

  #result { display: none; margin-top: 20px; border-radius: 12px; padding: 20px; text-align: center; }
  #result.healthy { background: #E9F5EA; border: 1px solid var(--healthy); }
  #result.infected { background: #FBEAEA; border: 1px solid var(--infected); }
  #resultLabel { font-size: 21px; font-weight: 700; }
  #result.healthy #resultLabel { color: var(--healthy); }
  #result.infected #resultLabel { color: var(--infected); }
  #resultRating { margin-top: 6px; font-size: 14px; color: #555; }
  #resultRating b { font-size: 16px; color: #222; }
  #tissueBreakdown { margin-top: 12px; font-size: 12px; color: #666; }

  #warnings {
    display: none;
    margin-top: 14px;
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13px;
    color: #6b5000;
    text-align: left;
  }
  #warnings b { display: block; margin-bottom: 6px; }
  #warnings ul { margin: 0; padding-left: 18px; }
</style>
</head>
<body>
<div class="card">
  <h2>Leaf Scorer</h2>
  <p id="subtitle">Upload one leaf photo on a plain dark background, lit evenly, from directly above.</p>
  <div id="status">Starting…</div>

  <div id="dropZone">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#7A9184" stroke-width="1.5">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <path d="M21 15l-5-5L5 21"/>
    </svg>

    <button id="selectBtn" type="button">Select Image</button>
    <div id="dropZoneSub">Accepted: JPG, JPEG, PNG. One image at a time.</div>

    <div id="previewWrap">
      <img id="previewImg" alt="Selected leaf">
      <button id="changeImageBtn" type="button">Choose a different photo</button>
    </div>
  </div>
  <input id="fileInput" type="file" accept="image/*">

  <canvas id="procCanvas"></canvas>

  <button id="analyzeBtn" disabled>Analyze Photo</button>

  <div id="result">
    <div id="resultLabel"></div>
    <div id="resultRating"></div>
    <div id="tissueBreakdown"></div>
  </div>

  <div id="warnings">
    <b>Heads up:</b>
    <ul id="warningsList"></ul>
  </div>
</div>

<script type="module">
  import { LeafScorer, disposeResult } from './score.js';

  const MODEL_URL = 'model_v2.json';
  // NOTE: leafscore.py never resizes the image — every morphological op in
  // this pipeline (CHLOR_OPEN, BLOOM_OPEN, the 101px median blur, the 13px
  // erosion disk, etc.) uses a FIXED PIXEL RADIUS tuned against full-
  // resolution photos. Downscaling before processing shifts those radii
  // relative to the leaf and silently changes classification results —
  // confirmed by testing (tissue % drifted while severity stayed close).
  // Only clamp truly extreme sizes as a memory safety net, not for "typical
  // photo" performance.
  const MAX_SIDE = 6000;

  let scorer = null;
  let modelReady = false;
  let selectedFile = null;

  function log(msg) { console.log('[leaf-scorer] ' + msg); }
  function setStatus(msg, isError) {
    const el = document.getElementById('status');
    el.innerText = msg;
    el.className = isError ? 'error' : '';
    log((isError ? 'ERROR: ' : '') + msg);
  }

  function waitForCv() {
    return new Promise((resolve, reject) => {
      const start = Date.now();
      const check = () => {
        if (window.cv && window.cv.Mat) { resolve(); return; }
        if (Date.now() - start > 45000) { reject(new Error('OpenCV.js did not finish loading (timed out)')); return; }
        setTimeout(check, 100);
      };
      check();
    });
  }

  function init() {
    log('DOM ready — wiring up UI');

    const dropZone       = document.getElementById('dropZone');
    const selectBtn       = document.getElementById('selectBtn');
    const dropZoneSub     = document.getElementById('dropZoneSub');
    const previewWrap     = document.getElementById('previewWrap');
    const previewImg      = document.getElementById('previewImg');
    const changeBtn        = document.getElementById('changeImageBtn');
    const fileInput        = document.getElementById('fileInput');
    const analyzeBtn       = document.getElementById('analyzeBtn');
    const result           = document.getElementById('result');
    const resultLabel      = document.getElementById('resultLabel');
    const resultRating     = document.getElementById('resultRating');
    const tissueBreakdown  = document.getElementById('tissueBreakdown');
    const warnings         = document.getElementById('warnings');
    const warningsList     = document.getElementById('warningsList');
    const canvas           = document.getElementById('procCanvas');
    const ctx               = canvas.getContext('2d');

    // ── Image selection works immediately — not gated on model/OpenCV load ──
    selectBtn.addEventListener('click', () => { log('Select Image clicked'); fileInput.click(); });
    changeBtn.addEventListener('click', () => { log('Change image clicked'); fileInput.click(); });

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', () => {
      log('File input change, files=' + fileInput.files.length);
      if (fileInput.files && fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
      log('File selected: ' + file.name + ' (' + file.type + ', ' + file.size + ' bytes)');
      selectedFile = file;
      previewImg.src = URL.createObjectURL(file);

      dropZone.querySelector('svg').style.display = 'none';
      selectBtn.style.display = 'none';
      dropZoneSub.style.display = 'none';
      previewWrap.style.display = 'block';

      result.style.display = 'none';
      warnings.style.display = 'none';

      if (modelReady) {
        analyzeBtn.disabled = false;
        analyzeBtn.classList.add('active');
        setStatus('Ready to analyze');
      } else {
        analyzeBtn.disabled = true;
        analyzeBtn.classList.remove('active');
        setStatus('Image selected — waiting for the model to finish loading…');
      }
    }

    analyzeBtn.addEventListener('click', () => {
      log('Analyze clicked, modelReady=' + modelReady + ' selectedFile=' + !!selectedFile);
      if (!selectedFile) { setStatus('Select an image first', true); return; }
      if (!modelReady || !scorer) { setStatus('Model is not ready yet — please wait a moment and try again', true); return; }
      runInference();
    });

    function runInference() {
      analyzeBtn.disabled = true;
      analyzeBtn.classList.remove('active');
      analyzeBtn.innerText = 'Analyzing…';
      result.style.display = 'none';
      warnings.style.display = 'none';
      setStatus('Running inference…');

      const img = new Image();
      img.onload = () => {
        try {
          let w = img.naturalWidth, h = img.naturalHeight;
          if (Math.max(w, h) > MAX_SIDE) {
            const scale = MAX_SIDE / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          canvas.width = w;
          canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);

          const rgba = cv.imread(canvas);
          const r = scorer.score(rgba);
          rgba.delete();

          if (!r.ok) {
            setStatus(r.detail || r.error, true);
            result.style.display = 'none';
            analyzeBtn.disabled = false;
            analyzeBtn.classList.add('active');
            analyzeBtn.innerText = 'Analyze Photo';
            return;
          }

          // Print everything JSON-safe for direct comparison against
          // `python leafscore.py <same image>`'s printed output.
          const { _debug, ...printable } = r;
          console.log('[leaf-scorer] full result (compare against Python CLI output):');
          console.log(JSON.stringify(printable, null, 2));

          const isInfected = r.verdict === 'DISEASED';
          result.className = isInfected ? 'infected' : 'healthy';
          resultLabel.innerText = isInfected ? 'Infected' : 'Healthy';
          resultRating.innerHTML = 'Rating: <b>' + r.severity_0_10.toFixed(1) + ' / 10</b>';
          tissueBreakdown.innerText =
            'Healthy tissue ' + r.tissue.healthy_pct + '% · Chlorotic ' + r.tissue.chlorotic_pct +
            '% · Bloom ' + r.tissue.bloom_pct + '%';
          result.style.display = 'block';

          if (r.quality.warnings && r.quality.warnings.length > 0) {
            warningsList.innerHTML = '';
            r.quality.warnings.forEach((w) => {
              const li = document.createElement('li');
              li.innerText = w;
              warningsList.appendChild(li);
            });
            warnings.style.display = 'block';
          }

          disposeResult(r);
          setStatus('Done');
        } catch (err) {
          console.error(err);
          setStatus('Analysis failed: ' + err.message, true);
        }

        analyzeBtn.disabled = false;
        analyzeBtn.classList.add('active');
        analyzeBtn.innerText = 'Analyze Photo';
      };
      img.onerror = () => {
        setStatus('Could not load the selected image file', true);
        analyzeBtn.disabled = false;
        analyzeBtn.classList.add('active');
        analyzeBtn.innerText = 'Analyze Photo';
      };
      img.src = URL.createObjectURL(selectedFile);
    }

    boot();

    async function boot() {
      try {
        setStatus('Loading OpenCV…');
        await waitForCv();
        log('OpenCV ready');

        setStatus('Loading model…');
        scorer = await LeafScorer.load(MODEL_URL);
        modelReady = true;
        log('Model loaded');

        if (selectedFile) {
          analyzeBtn.disabled = false;
          analyzeBtn.classList.add('active');
          setStatus('Ready to analyze');
        } else {
          setStatus('Ready — select an image');
        }
      } catch (err) {
        console.error(err);
        setStatus('Startup failed: ' + err.message, true);
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>
</body>
</html>
