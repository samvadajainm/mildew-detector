<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaf Scorer</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<style>
  :root {
    --forest: #1B3A2E;
    --forest-hover: #142B22;
    --mint-bg: #EAF3EC;
    --mint-border: #A9C9B3;
    --page-bg: #F5F1E6;
    --healthy: #2E7D32;
    --infected: #B71C1C;
    --gray-disabled: #D9D6CC;
    --error: #B71C1C;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--page-bg);
    margin: 0;
    padding: 40px 16px;
  }
  .card { max-width: 460px; margin: 0 auto; }
  h2 { color: #1a1a1a; text-align: center; font-size: 26px; margin: 0 0 6px; }
  #subtitle { text-align: center; color: #555; margin: 0 0 20px; font-size: 15px; }
  #status {
    text-align: center;
    color: #888;
    margin-bottom: 14px;
    min-height: 16px;
    font-size: 13px;
  }
  #status.error { color: var(--error); font-weight: 600; }

  #dropZone {
    border: 2px dashed var(--mint-border);
    border-radius: 14px;
    background: var(--mint-bg);
    padding: 40px 24px;
    text-align: center;
  }
  #dropZone.dragover { border-color: var(--forest); }
  #dropZone svg { display: block; margin: 0 auto 18px; }

  #selectBtn {
    background: var(--forest);
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #selectBtn:hover { background: var(--forest-hover); }

  #dropZoneSub { color: #6b6b6b; font-size: 13px; margin-top: 14px; }
  #fileInput { display: none; }

  #previewWrap { display: none; }
  #previewImg {
    max-width: 100%;
    max-height: 240px;
    border-radius: 8px;
    display: block;
    margin: 0 auto 14px;
  }
  #changeImageBtn {
    background: none;
    border: 1px solid var(--mint-border);
    color: var(--forest);
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  #changeImageBtn:hover { background: #DDEBE1; }

  #procCanvas { display: none; }

  #analyzeBtn {
    width: 100%;
    margin-top: 18px;
    background: var(--gray-disabled);
    color: #9c988c;
    border: none;
    padding: 15px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: default;
    transition: background 0.15s, color 0.15s;
    box-sizing: border-box;
  }
  #analyzeBtn.active { background: var(--forest); color: white; cursor: pointer; }
  #analyzeBtn.active:hover { background: var(--forest-hover); }

  #result { display: none; margin-top: 20px; border-radius: 12px; padding: 20px; text-align: center; }
  #result.healthy { background: #E9F5EA; border: 1px solid var(--healthy); }
  #result.infected { background: #FBEAEA; border: 1px solid var(--infected); }
  #resultLabel { font-size: 21px; font-weight: 700; }
  #result.healthy #resultLabel { color: var(--healthy); }
  #result.infected #resultLabel { color: var(--infected); }
  #resultRating { margin-top: 6px; font-size: 14px; color: #555; }
  #resultRating b { font-size: 16px; color: #222; }
</style>
</head>
<body>
<div class="card">
  <h2>Leaf Scorer</h2>
  <p id="subtitle">Upload one image to check a plant for powdery mildew.</p>
  <div id="status">Starting…</div>

  <div id="dropZone">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#7A9184" stroke-width="1.5">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <path d="M21 15l-5-5L5 21"/>
    </svg>

    <button id="selectBtn" type="button">Select Image</button>
    <div id="dropZoneSub">Accepted: JPG, JPEG, PNG. One image at a time.</div>

    <div id="previewWrap">
      <img id="previewImg" alt="Selected leaf">
      <button id="changeImageBtn" type="button">Choose a different photo</button>
    </div>
  </div>
  <input id="fileInput" type="file" accept="image/*">

  <canvas id="procCanvas" width="224" height="224"></canvas>

  <button id="analyzeBtn" disabled>Analyze Photo</button>

  <div id="result">
    <div id="resultLabel"></div>
    <div id="resultRating"></div>
  </div>
</div>

<script>
(function () {
  // ── Config — mildew_detector.onnx is untouched; these must match its signature ──
  var MODEL_URL   = 'mildew_detector.onnx';
  var INPUT_NAME  = 'serving_default_image_input:0';
  var OUTPUT_NAME = 'StatefulPartitionedCall_1:0';
  var INPUT_SIZE  = 224;
  var RATING_THRESHOLD = 4; // rating > 4 => Infected

  var session = null;
  var modelReady = false;
  var selectedFile = null;

  function log(msg) { console.log('[leaf-scorer] ' + msg); }
  function setStatus(msg, isError) {
    var el = document.getElementById('status');
    el.innerText = msg;
    el.className = isError ? 'error' : '';
    log((isError ? 'ERROR: ' : '') + msg);
  }

  function init() {
    log('DOM ready — wiring up UI');

    var dropZone     = document.getElementById('dropZone');
    var selectBtn    = document.getElementById('selectBtn');
    var dropZoneSub  = document.getElementById('dropZoneSub');
    var previewWrap  = document.getElementById('previewWrap');
    var previewImg   = document.getElementById('previewImg');
    var changeBtn    = document.getElementById('changeImageBtn');
    var fileInput    = document.getElementById('fileInput');
    var analyzeBtn   = document.getElementById('analyzeBtn');
    var result       = document.getElementById('result');
    var resultLabel  = document.getElementById('resultLabel');
    var resultRating = document.getElementById('resultRating');
    var canvas       = document.getElementById('procCanvas');
    var ctx          = canvas.getContext('2d');

    // ── Image selection works immediately — NOT gated behind model load ──
    selectBtn.addEventListener('click', function () {
      log('Select Image clicked');
      fileInput.click();
    });
    changeBtn.addEventListener('click', function () {
      log('Change image clicked');
      fileInput.click();
    });

    dropZone.addEventListener('dragover', function (e) {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', function () {
      dropZone.classList.remove('dragover');
    });
    dropZone.addEventListener('drop', function (e) {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', function () {
      log('File input change event, files=' + fileInput.files.length);
      if (fileInput.files && fileInput.files[0]) {
        handleFile(fileInput.files[0]);
      }
    });

    function handleFile(file) {
      log('File selected: ' + file.name + ' (' + file.type + ', ' + file.size + ' bytes)');
      selectedFile = file;
      previewImg.src = URL.createObjectURL(file);

      dropZone.querySelector('svg').style.display = 'none';
      selectBtn.style.display = 'none';
      dropZoneSub.style.display = 'none';
      previewWrap.style.display = 'block';

      result.style.display = 'none';

      if (modelReady) {
        analyzeBtn.disabled = false;
        analyzeBtn.classList.add('active');
        setStatus('Ready to analyze');
      } else {
        analyzeBtn.disabled = true;
        analyzeBtn.classList.remove('active');
        setStatus('Image selected — waiting for model to finish loading…');
      }
    }

    analyzeBtn.addEventListener('click', function () {
      log('Analyze clicked, modelReady=' + modelReady + ' selectedFile=' + !!selectedFile);
      if (!selectedFile) {
        setStatus('Select an image first', true);
        return;
      }
      if (!modelReady || !session) {
        setStatus('Model is not ready yet — please wait a moment and try again', true);
        return;
      }
      runInference();
    });

    function runInference() {
      analyzeBtn.disabled = true;
      analyzeBtn.classList.remove('active');
      analyzeBtn.innerText = 'Analyzing…';
      result.style.display = 'none';
      setStatus('Running inference…');

      var img = new Image();
      img.onload = function () {
        try {
          ctx.drawImage(img, 0, 0, INPUT_SIZE, INPUT_SIZE);
          var imageData = ctx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE).data;

          // NHWC float32, raw 0-255 values, no normalization
          var floatData = new Float32Array(INPUT_SIZE * INPUT_SIZE * 3);
          for (var i = 0, j = 0; i < imageData.length; i += 4, j += 3) {
            floatData[j]     = imageData[i];
            floatData[j + 1] = imageData[i + 1];
            floatData[j + 2] = imageData[i + 2];
          }

          var tensor = new ort.Tensor('float32', floatData, [1, INPUT_SIZE, INPUT_SIZE, 3]);
          var feeds = {};
          feeds[INPUT_NAME] = tensor;

          session.run(feeds).then(function (output) {
            log('Inference complete');
            var score = output[OUTPUT_NAME].data[0];
            var rating = Math.round(score * 10 * 10) / 10;
            var isInfected = rating > RATING_THRESHOLD;

            result.className = isInfected ? 'infected' : 'healthy';
            resultLabel.innerText = isInfected ? 'Infected' : 'Healthy';
            resultRating.innerHTML = 'Rating: <b>' + rating.toFixed(1) + ' / 10</b>';
            result.style.display = 'block';
            setStatus('Done');

            analyzeBtn.disabled = false;
            analyzeBtn.classList.add('active');
            analyzeBtn.innerText = 'Analyze Photo';
          }).catch(function (err) {
            setStatus('Inference failed: ' + err.message, true);
            analyzeBtn.disabled = false;
            analyzeBtn.classList.add('active');
            analyzeBtn.innerText = 'Analyze Photo';
          });
        } catch (err) {
          setStatus('Preprocessing failed: ' + err.message, true);
          analyzeBtn.disabled = false;
          analyzeBtn.classList.add('active');
          analyzeBtn.innerText = 'Analyze Photo';
        }
      };
      img.onerror = function () {
        setStatus('Could not load the selected image file', true);
        analyzeBtn.disabled = false;
        analyzeBtn.classList.add('active');
        analyzeBtn.innerText = 'Analyze Photo';
      };
      img.src = URL.createObjectURL(selectedFile);
    }

    loadModel();

    function loadModel() {
      if (typeof ort === 'undefined') {
        setStatus('onnxruntime-web failed to load from CDN — check your network/ad-blocker', true);
        return;
      }
      setStatus('Loading model…');
      ort.InferenceSession.create(MODEL_URL).then(function (s) {
        session = s;
        modelReady = true;
        log('Model loaded. Inputs=' + s.inputNames.join(',') + ' Outputs=' + s.outputNames.join(','));
        if (selectedFile) {
          analyzeBtn.disabled = false;
          analyzeBtn.classList.add('active');
          setStatus('Ready to analyze');
        } else {
          setStatus('Model ready — select an image');
        }
      }).catch(function (err) {
        setStatus('Failed to load model: ' + err.message + ' (check that mildew_detector.onnx is in the same folder as this page)', true);
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
